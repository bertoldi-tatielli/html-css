<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos Iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
        }

        /* Existem parametros dentro di Iframe que seriam 
        FRAMEBORDER= 0 tira a borda e 1 coloca a borda
        HEIGHT/WIDTH="tamanho"
        SCOLLING="(AUTO = se o conteudo exeder ele vai criar a barra de rolagem
        YES = mesmo que o conteudo caber todo igualmente aparece a barra de rolagem
        NO= ainda que o conteudo for maior ele nao permitir fazer a rolagem)" */
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 

        <!-- Tamanho padrao 300x150 -->
    <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
    </iframe>
    para aprender a programar</p>
    
    O repósitorio do Guanabara
    <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
        no <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
    </iframe>

    também é bem legal!
</body>
</html>
